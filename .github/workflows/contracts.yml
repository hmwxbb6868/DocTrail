name: Contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract validator dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Validate YAML, OpenAPI, examples, and interface contracts
        run: python contracts/validate_contracts.py
