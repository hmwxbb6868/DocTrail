spring:
  main:
    web-application-type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:doctrail}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"
    username: ${MYSQL_USERNAME:doctrail}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

doctrail:
  auth:
    bootstrap:
      required: ${AUTH_BOOTSTRAP_REQUIRED:false}
      demo-username: ${DEMO_USERNAME:}
      demo-password: ${DEMO_PASSWORD:}
      admin-username: ${ADMIN_USERNAME:}
      admin-password: ${ADMIN_PASSWORD:}
