spring:
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:doctrail}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"
    username: ${MYSQL_USERNAME:doctrail}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

doctrail:
  auth:
    environment: ${AUTH_ENVIRONMENT:development}
    public-registration-enabled: ${AUTH_PUBLIC_REGISTRATION_ENABLED:true}
    sms-provider: ${AUTH_SMS_PROVIDER:}
    captcha:
      mode: ${AUTH_CAPTCHA_MODE:console}
      ttl: ${AUTH_CAPTCHA_TTL_SECONDS:300}s
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: ${ACCESS_TOKEN_TTL_SECONDS:1800}s
    refresh:
      token-ttl: ${REFRESH_TOKEN_TTL_SECONDS:604800}s
      cookie-name: ${REFRESH_COOKIE_NAME:refresh_token}
      cookie-secure: ${REFRESH_COOKIE_SECURE:false}
      cookie-same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      cookie-path: ${REFRESH_COOKIE_PATH:/api/auth}
