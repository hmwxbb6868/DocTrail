spring:
  application:
    name: doctrail
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE_MB:20}MB
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE_MB:25}MB

server:
  port: ${JAVA_SERVER_PORT:8080}

doctrail:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${INTERNAL_TOKEN:}
    connect-timeout: 10s
    read-timeout: ${AI_SERVICE_READ_TIMEOUT:90s}
  message:
    request-running-timeout: ${MESSAGE_REQUEST_RUNNING_TIMEOUT_SECONDS:900}s
    recovery-scan-interval: ${MESSAGE_REQUEST_RECOVERY_SCAN_INTERVAL_SECONDS:60}s
  storage:
    backend: ${STORAGE_BACKEND:}
    upload-root: ${UPLOAD_ROOT:./uploads}
    max-file-size-mb: ${UPLOAD_MAX_FILE_SIZE_MB:20}
    oss-bucket: ${OSS_BUCKET:}
    oss-endpoint: ${OSS_ENDPOINT:}
    oss-region: ${OSS_REGION:}
    oss-access-key-id: ${OSS_ACCESS_KEY_ID:}
    oss-access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    oss-key-prefix: ${OSS_KEY_PREFIX:doctrail}
    oss-connect-timeout: ${OSS_CONNECT_TIMEOUT:10s}
    oss-read-timeout: ${OSS_READ_TIMEOUT:60s}
    oss-max-retries: ${OSS_MAX_RETRIES:3}
  knowledge:
    processing:
      core-pool-size: ${KNOWLEDGE_PROCESSING_CORE_POOL_SIZE:2}
      max-pool-size: ${KNOWLEDGE_PROCESSING_MAX_POOL_SIZE:2}
      queue-capacity: ${KNOWLEDGE_PROCESSING_QUEUE_CAPACITY:20}
      processing-timeout: ${KNOWLEDGE_PROCESSING_TIMEOUT:30m}
      deleting-timeout: ${KNOWLEDGE_DELETING_TIMEOUT:30m}
      recovery-scan-interval: ${KNOWLEDGE_RECOVERY_SCAN_INTERVAL:60s}
