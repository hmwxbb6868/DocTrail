# Included inside the official image's http context.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30m;

    # Keep redirects relative to preserve the published host port.
    absolute_redirect off;

    # Operations endpoints remain container-internal.
    location = /health { return 404; }
    location ^~ /health/ { return 404; }
    location = /api { return 404; }

    location /api/ {
        # No URI suffix: preserve /api and the original query string.
        proxy_pass http://java:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
