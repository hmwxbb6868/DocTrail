[project]
name = "doctrail-python-service"
version = "0.1.0"
description = "DocTrail AI service dependency and compatibility baseline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faiss-cpu==1.15.1",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "langchain==1.4.2",
    "langchain-community==0.4.2",
    "langchain-core==1.6.3",
    "langchain-huggingface==1.2.2",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.6.2",
    "langchain-text-splitters==1.1.2",
    "mysql-connector-python==26.7.0",
    "numpy==2.4.6",
    "oss2==2.19.1",
    "pillow==13.0.0",
    "pydantic==2.13.5",
    "pypdf==6.21.4",
    "python-docx==1.2.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "redis==8.1.0",
    "sentence-transformers==6.1.0",
    "torch==2.14.0",
    "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv]
# Security constraints for transitive dependencies; keep the CPU torch source.
constraint-dependencies = [
    "aiohttp==3.14.5",
    "certifi==2026.10.23",
    "filelock==4.2.7",
    "langgraph==1.2.14",
    "langgraph-sdk==0.4.6",
    "multidict==6.9.1",
    "setuptools==84.1.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
